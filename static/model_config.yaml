# Model training, governance and monitoring settings.

training:
  # scheduled training dates; a drift alert can also trigger training in between
  first_train_date: "2024-01-01"
  retrain_every_months: 6
  # minimum months between two trainings, so one drift alert does not retrain every month
  retrain_cooldown_months: 3
  # newest label months held out as out-of-time (OOT) test
  oot_label_months: 2
  validation_ratio: 0.2
  random_state: 55
  # drop a feature when this share of the current month's applicants lack it
  max_missing_share: 0.5

promotion:
  # a challenger replaces the champion only if its OOT AUC is higher by this margin
  min_auc_gain: 0.01

monitoring:
  psi_watch: 0.1
  psi_act: 0.25
  # flag retraining when Gini falls below this share of the model's OOT Gini
  min_gini_ratio: 0.9
  # months between a prediction and its default label (label definition 30dpd_6mob)
  label_lag_months: 6

# Explicit allowlist: only these gold feature store columns can reach a model.
# Raw monetary columns have *_log1p twins; logistic regression uses the logs, XGBoost the raw values.
